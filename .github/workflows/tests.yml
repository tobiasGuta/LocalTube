name: Python and frontend tests
on:
  push:
    branches: [main, 'research/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Test backend and frontend contracts
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/player.js
